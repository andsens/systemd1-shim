version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keeps the actions used in .github/workflows/*.yml (checkout, setup-go,
  # ...) current too - same auto-merge path as the Go module bumps below.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
